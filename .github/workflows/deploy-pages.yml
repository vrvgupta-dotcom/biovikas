name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/great-pasteur-b5kdhu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Served from the custom domain bio.vikasgupta.world at the root,
      # so no base path — leave NEXT_PUBLIC_BASE_PATH unset. (Only set it
      # if this ever moves back to an unmapped project URL like
      # https://<user>.github.io/biovikas/.)
      - run: npm run build

      # Static export omits this, but GitHub Pages' default Jekyll
      # processing otherwise drops the underscore-prefixed _next/ assets.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
