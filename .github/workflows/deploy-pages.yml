name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/great-pasteur-b5kdhu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # This repo is served from https://vrvgupta-dotcom.github.io/biovikas/
      # (a project page, not a user/org root page), so every internal link
      # and asset path needs the /biovikas prefix baked in at build time.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /biovikas

      # Static export omits this, but GitHub Pages' default Jekyll
      # processing otherwise drops the underscore-prefixed _next/ assets.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
